<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Strawberry Chat Overlay</title>
<style>
*{box-sizing:border-box}body{margin:0;background:transparent;font-family:Arial,sans-serif;overflow:hidden}
#chat{display:flex;flex-direction:column;gap:12px;padding:14px;align-items:flex-start}
.msg{max-width:90%;animation:pop .25s ease-out;display:flex;gap:8px;align-items:flex-start}.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none}.content{min-width:0}.gift .bubble{background:linear-gradient(135deg,#fff1b8,#ffb2d1);border:1px solid #f2a1bf}.gift-tag{font-size:12px;color:#b44b78;font-weight:900;margin:0 0 4px 8px}
.name{font-weight:900;color:#fff;text-shadow:-2px -2px #ff8ab7,2px 2px #ff8ab7,-2px 2px #ff8ab7,2px -2px #ff8ab7;font-size:20px;margin:0 0 4px 8px}
.bubble{display:inline-block;background:linear-gradient(135deg,#fff,#ff9fc4);color:#171717;border-radius:24px;padding:14px 20px;font-size:20px;box-shadow:0 5px 18px #0002;overflow-wrap:anywhere}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
</style></head><body><div id="chat"></div><script>
let seen=0;
async function refresh(){try{const r=await fetch('/messages?'+Date.now());const d=await r.json();const a=d.messages||[];
if(a.length<seen)seen=0;
for(let i=seen;i<a.length;i++){const m=a[i],el=document.createElement('div');el.className='msg'+(m.type==='gift'?' gift':'');
if(m.avatar){const av=document.createElement('img');av.className='avatar';av.src=m.avatar;el.append(av);}
const content=document.createElement('div');content.className='content';
const n=document.createElement('div');n.className='name';n.textContent=m.name;content.append(n);
if(m.type==='gift'){const tag=document.createElement('div');tag.className='gift-tag';tag.textContent='🎁 CADEAU';content.append(tag);}
const b=document.createElement('div');b.className='bubble';b.textContent=m.text;content.append(b);
if(m.type==='gift'&&m.giftImage){const gi=document.createElement('img');gi.src=m.giftImage;gi.style.width='28px';gi.style.height='28px';gi.style.verticalAlign='middle';gi.style.marginLeft='6px';b.append(gi);}
el.append(content);document.querySelector('#chat').append(el);}
seen=a.length;while(document.querySelectorAll('.msg').length>8)document.querySelector('.msg').remove();
}catch(e){}}
setInterval(refresh,650);refresh();
</script></body></html>
