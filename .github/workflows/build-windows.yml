name: Build Strawberry Studio for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build standalone EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name StrawberryStudio --add-data "overlay.html;." --hidden-import websocket --hidden-import obsws_python app.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: StrawberryStudio-Windows
          path: dist/StrawberryStudio.exe
          if-no-files-found: error
          retention-days: 14
